env_name: macpo_point
algorithm_name: macpo_point
experiment_name: point_multigoal_balanced
seed: 0
run_dir: ./runs
num_env_steps: 10000000  # Balanced training duration
episode_length: 1000
n_rollout_threads: 10  # Balanced sampling diversity
n_eval_rollout_threads: 1
hidden_size: 256  # Reduced from 512 to prevent overfitting on low-dim control
use_render: False
recurrent_N: 1

# Video recording settings
use_wandb: True
wandb_project: safepo
record_video: True
video_record_freq: 1
render_max_reward: -1.0e9

save_interval: 20
use_eval: True
eval_interval: 10
log_interval: 10
eval_episodes: 10

# Safety constraints - BALANCED (symmetric factor + optimized for point robot)
# Designed to prevent both under-constraint (performance collapse) and over-constraint (learning slowdown)
cost_limit: 32  # ← BALANCED: 32 steps of cost in 1000-step episode (0.032/step)
EPS: 1.e-8
safety_gamma: 0.10  # ← BALANCED: Neither too strict nor too loose
step_fraction: 0.5
g_step_dir_coef: 0.1
b_step_dir_coef: 0.1
fraction_coef: 0.1

# Value function and GAE
gamma: 0.97  # Balance immediate and future rewards
gae_lambda: 0.95  # Smooth GAE estimates
use_gae: True
use_popart: True
use_valuenorm: True
use_proper_time_limits: False

# Policy optimization - STABILIZED for multi-agent learning with symmetric factors
target_kl: 0.03  # Slightly increased for more conservative updates
searching_steps: 30  # More line search attempts for safety
conjugate_gradient_iters: 25  # Balanced convergence
accept_ratio: 0.5
clip_param: 0.2
learning_iters: 15  # Reduced to prevent overfitting on weak signals
num_mini_batch: 6  # ← BALANCED: Reduced variance, better gradient estimates
data_chunk_length: 
value_loss_coef: 2.0  # Standard value learning weight
entropy_coef: 0.02  # Moderate entropy for exploration without instability
max_grad_norm: 10
huber_delta: 10.0
use_recurrent_policy: False
use_naive_recurrent_policy: False
use_max_grad_norm: True
use_clipped_value_loss: True
use_huber_loss: True
use_value_active_masks: False
use_policy_active_masks: False

# Learning rates - MODERATE (reduced from original for stability)
actor_lr: 1.0e-4  # ← REDUCED: 0.0001 for stability
critic_lr: 5.0e-3  # ← REDUCED: 0.005 for stability
opti_eps: 1.e-5
weight_decay: 0  # No regularization

gain: 0.01
actor_gain: 0.01
use_orthogonal: True

use_feature_normalization: True
use_ReLU: True
stacked_frames: 1
layer_N: 2

std_x_coef: 1
std_y_coef: 0.5

mamujoco: 
  layer_N: 1
  num_env_steps: 10000000
  episode_length: 1000
  n_rollout_threads: 10
  n_eval_rollout_threads: 1
  hidden_size: 128
  gamma: 0.99
  safety_gamma: 0.2
  target_kl: 0.01
  learning_iters: 15
  entropy_coef: 0.01

env_name: macpo
algorithm_name: macpo
experiment_name: point_multigoal
seed: 0
run_dir: ./runs
num_env_steps: 12000000  # Balanced training duration
episode_length: 1000
n_rollout_threads: 24  # Balanced sampling diversity
n_eval_rollout_threads: 1
hidden_size: 256  # Reduced from 512 to prevent overfitting on low-dim control
use_render: False
recurrent_N: 1

# Video recording settings
use_wandb: True
wandb_project: safepo
record_video: True
video_record_freq: 1
render_max_reward: -1.0e9

save_interval: 20
use_eval: True
eval_interval: 10
log_interval: 10
eval_episodes: 10

# Safety constraints - tuned for Point robot
cost_limit: 30  # Further relaxed to encourage both agents to move
EPS: 1.e-8
safety_gamma: 0.08  # Reduced to allow more freedom
step_fraction: 0.5
g_step_dir_coef: 0.1
b_step_dir_coef: 0.1
fraction_coef: 0.1

# Value function and GAE
gamma: 0.95  # Reduced to emphasize short-term coordination
gae_lambda: 0.94  # Sharper advantage estimates for clearer signals
use_gae: True
use_popart: True
use_valuenorm: True
use_proper_time_limits: False

# Policy optimization - adjusted for Point's 2D control space
target_kl: 0.008  # Tighter constraint to prevent policy collapse
searching_steps: 15  # More aggressive line search
conjugate_gradient_iters: 18  # Balance between accuracy and speed
accept_ratio: 0.5
clip_param: 0.2
learning_iters: 12  # More thorough updates
num_mini_batch: 2  # CRITICAL: Reduced from 3, balance variance and stability
data_chunk_length: 
value_loss_coef: 1.2  # Increased to strengthen value learning
entropy_coef: 0.025  # Reduced from 0.04, moderate exploration
max_grad_norm: 10
huber_delta: 10.0
use_recurrent_policy: False
use_naive_recurrent_policy: False
use_max_grad_norm: True
use_clipped_value_loss: True
use_huber_loss: True
use_value_active_masks: False
use_policy_active_masks: False

# Learning rates - more aggressive to escape local optima
actor_lr: 1.5e-4  # CRITICAL: Significantly increased to speed up learning
critic_lr: 7.0e-3  # Increased for faster value convergence
opti_eps: 1.e-5
weight_decay: 0  # Removed weight decay to allow full learning capacity

gain: 0.01
actor_gain: 0.01
use_orthogonal: True

use_feature_normalization: True
use_ReLU: True
stacked_frames: 1
layer_N: 2

std_x_coef: 1
std_y_coef: 0.5

mamujoco: 
  layer_N: 1
  num_env_steps: 10000000
  episode_length: 1000
  n_rollout_threads: 10
  n_eval_rollout_threads: 1
  hidden_size: 128
  gamma: 0.99
  safety_gamma: 0.2
  target_kl: 0.01
  learning_iters: 15
  entropy_coef: 0.01

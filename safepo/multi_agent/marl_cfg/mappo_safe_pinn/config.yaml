# Configuration for MAPPO-Safe-PINN (Safe-pH-MARL)
# Barrier Port-Hamiltonian Physics-Informed Neural Network Actor
#
# This implements the Safe-pH-MARL framework:
# - H_task: Neural network learned task potential (goal attraction)
# - H_barrier: Barrier Lyapunov Function potential (collision avoidance)
# - J: Skew-symmetric interconnection (gyroscopic forces)
# - R: Positive semi-definite dissipation (stability)

env_name: mappo_safe_pinn
algorithm_name: mappo_safe_pinn
experiment_name: safe_pinn
seed: 0
run_dir: ./runs
num_env_steps: 10000000
episode_length: 1000
n_rollout_threads: 20
n_eval_rollout_threads: 1
hidden_size: 256
use_render: False
recurrent_N: 1
use_single_network: False

save_interval: 50
use_eval: True
eval_interval: 25
log_interval: 25
eval_episodes: 10

gamma: 0.96
gae_lambda: 0.95
use_gae: True
use_popart: True
use_valuenorm: False
use_proper_time_limits: False

target_kl: 0.016
searching_steps: 10
accept_ratio: 0.5
clip_param: 0.2
learning_iters: 5
num_mini_batch: 1
data_chunk_length: 
value_loss_coef: 1
entropy_coef: 0.0
max_grad_norm: 10
huber_delta: 10.0
use_recurrent_policy: False
use_naive_recurrent_policy: False
use_max_grad_norm: True
use_clipped_value_loss: True
use_huber_loss: True
use_value_active_masks: False
use_policy_active_masks: False

actor_lr: 9.e-5
critic_lr: 5.e-3
opti_eps: 1.e-5
weight_decay: 0.0

gain: 0.01
actor_gain: 0.01
use_orthogonal: True

use_feature_normalization: True
use_ReLU: True
stacked_frames: 1
layer_N: 2

std_x_coef: 1
std_y_coef: 0.5

# ==================================================
# Barrier Port-Hamiltonian PINN specific parameters
# ==================================================

# Physics network hidden size
physics_hidden: 128         # Hidden size for physics networks (H_task, H_barrier, J, R)

# Physics state dimension
pinn_state_dim: 4           # Physics state dimension: (vx, vy, ax, ay)

# ==================================================
# Barrier Potential Parameters (v9.3 指数型强化 - 中心势能接近100)
# ==================================================

# Core barrier parameters (指数型 - 极强梯度变化)
barrier_r_safe: 0.08        # Safe distance threshold - 进一步减小到0.08
barrier_epsilon: 0.1        # Numerical stability - 增大到0.1使势能更平滑
barrier_clip_max: 100.0     # Maximum barrier potential - 100上限

# Enhanced barrier strength parameters (指数型 - 中心势能≈100)
# 计算: k * (exp(5*proximity) - 1), proximity=1时 exp(5)-1≈147.4
# 要达到H≈100: k ≈ 100/147.4 ≈ 0.68, 所以min_barrier_k设为0.68
barrier_k_scale: 5.0        # Multiplier for barrier stiffness - 增加到5.0以增强网络学习能力
barrier_gradient_scale: 2.0 # Multiplier for barrier gradient influence - 增加到2.0以增强梯度
barrier_decay_rate: 5.0     # Power for distance decay - 保持5.0（指数alpha=5.0）
min_barrier_k: 0.68         # Minimum barrier stiffness - 设为0.68以确保中心势能≈100

# Cost-aware safety parameters (精准化)
cost_aware_weight: 0.02     # Weight for cost-aware policy shaping
danger_zone_threshold: 0.98 # Lidar reading threshold - 只有极近时才触发

# Lidar configuration (for obstacle detection)
num_lidar_bins: 16          # Number of lidar bins per obstacle type

# ==================================================
# Lagrangian Constraint Parameters (NEW - 约束cost)
# ==================================================
use_lagrangian: True        # Enable Lagrangian constraint for cost
cost_limit: 25.0            # Target cost limit per episode
lagrangian_init: 0.001      # Initial Lagrangian multiplier
lagrangian_lr: 0.035        # Learning rate for Lagrangian multiplier
lagrangian_max: 10.0        # Maximum Lagrangian multiplier

# ==================================================
# Safety Action Constraint (NEW - 动作层安全约束)
# ==================================================
use_safety_layer: True      # Enable safety layer for action correction
safety_gamma: 0.1           # Safety layer correction strength
action_clip_margin: 0.1     # Margin for safe action clipping

# Physics regularization and auxiliary loss weights (增强安全学习)
physics_loss_weight: 0.0    # Weight for physics regularization (0 = pure RL)
aux_task_potential_weight: 0.05     # Task potential auxiliary loss weight (增大)
aux_barrier_potential_weight: 0.1   # Barrier potential auxiliary loss weight (增大)
aux_safety_weight: 0.2              # Safety auxiliary loss weight (增大)

# Video recording (Fixed-interval rendering)
record_video: True          # Enable video recording
video_record_freq: 1        # Record video every N eval intervals (1 = every eval)

mamujoco: 
  num_env_steps: 10000000
  episode_length: 1000
  n_rollout_threads: 10
  n_eval_rollout_threads: 1
  hidden_size: 128
  gamma: 0.99
  entropy_coef: 0.01
  max_grad_norm: 10.0
  use_value_active_masks: True
  use_policy_active_masks: True
  data_chunk_length: 10
  use_valuenorm: False

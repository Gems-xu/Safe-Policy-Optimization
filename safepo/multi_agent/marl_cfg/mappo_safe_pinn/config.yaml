# Configuration for MAPPO-Safe-PINN (Safe-pH-MARL)
# Barrier Port-Hamiltonian Physics-Informed Neural Network Actor
#
# This implements the Safe-pH-MARL framework:
# - H_task: Neural network learned task potential (goal attraction)
# - H_barrier: Barrier Lyapunov Function potential (collision avoidance)
# - J: Skew-symmetric interconnection (gyroscopic forces)
# - R: Positive semi-definite dissipation (stability)

env_name: mappo_safe_pinn
algorithm_name: mappo_safe_pinn
experiment_name: safe_pinn
seed: 0
run_dir: ./runs
num_env_steps: 10000000
episode_length: 1000
n_rollout_threads: 20
n_eval_rollout_threads: 1
hidden_size: 256
use_render: False
recurrent_N: 1
use_single_network: False

save_interval: 50
use_eval: True
eval_interval: 25
log_interval: 25
eval_episodes: 10

gamma: 0.96
gae_lambda: 0.95
use_gae: True
use_popart: True
use_valuenorm: False
use_proper_time_limits: False

target_kl: 0.016
searching_steps: 10
accept_ratio: 0.5
clip_param: 0.2
learning_iters: 5
num_mini_batch: 1
data_chunk_length: 
value_loss_coef: 1
entropy_coef: 0.0
max_grad_norm: 10
huber_delta: 10.0
use_recurrent_policy: False
use_naive_recurrent_policy: False
use_max_grad_norm: True
use_clipped_value_loss: True
use_huber_loss: True
use_value_active_masks: False
use_policy_active_masks: False

actor_lr: 9.e-5
critic_lr: 5.e-3
opti_eps: 1.e-5
weight_decay: 0.0

gain: 0.01
actor_gain: 0.01
use_orthogonal: True

use_feature_normalization: True
use_ReLU: True
stacked_frames: 1
layer_N: 2

std_x_coef: 1
std_y_coef: 0.5

# ==================================================
# Barrier Port-Hamiltonian PINN specific parameters
# ==================================================

# Physics network hidden size
physics_hidden: 128         # Hidden size for physics networks (H_task, H_barrier, J, R)

# Physics state dimension
pinn_state_dim: 4           # Physics state dimension: (vx, vy, ax, ay)

# ==================================================
# Barrier Potential Parameters (Enhanced Safety)
# ==================================================

# Core barrier parameters
barrier_r_safe: 0.5         # Safe distance threshold - increased for earlier avoidance
barrier_epsilon: 0.005      # Numerical stability - reduced for steeper barrier
barrier_clip_max: 100.0     # Maximum barrier potential (increased for stronger safety)

# Enhanced barrier strength parameters
barrier_k_scale: 2.0        # Multiplier for barrier stiffness (>1 = stronger barrier)
barrier_gradient_scale: 1.5 # Multiplier for barrier gradient influence
barrier_decay_rate: 2.0     # Power for distance decay (higher = sharper barrier near r_safe)
min_barrier_k: 0.5          # Minimum barrier stiffness to ensure base safety

# Cost-aware safety parameters
cost_aware_weight: 0.3      # Weight for cost-aware policy shaping in danger zones
danger_zone_threshold: 0.8  # Lidar reading threshold for danger zone detection (0-1)

# Lidar configuration (for obstacle detection)
num_lidar_bins: 16          # Number of lidar bins per obstacle type

# Physics regularization (optional)
physics_loss_weight: 0.0    # Weight for physics regularization (0 = pure RL)

# Video recording (Fixed-interval rendering)
record_video: True          # Enable video recording
video_record_freq: 1        # Record video every N eval intervals (1 = every eval)

mamujoco: 
  num_env_steps: 10000000
  episode_length: 1000
  n_rollout_threads: 10
  n_eval_rollout_threads: 1
  hidden_size: 128
  gamma: 0.99
  entropy_coef: 0.01
  max_grad_norm: 10.0
  use_value_active_masks: True
  use_policy_active_masks: True
  data_chunk_length: 10
  use_valuenorm: False
